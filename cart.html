<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asmak | Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="index.html" class="brand">
          <span class="brand-mark" aria-hidden="true">🐟</span>
          <span>
            <div class="brand-name">Asmak</div>
            <div class="brand-tagline">Fresh daily to your door</div>
          </span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="index.html#products">Products</a>
          <a href="cart.html" class="is-current">Cart</a>
        </nav>
      </div>
    </header>

    <main class="page-wrap">
      <nav class="checkout-steps" id="checkout-steps" aria-label="Checkout steps"></nav>

      <header class="page-title">
        <h1>Shopping cart</h1>
        <p>Review your items or change quantities before continuing.</p>
      </header>

      <div class="page-layout">
        <section class="page-main">
          <div id="cart-empty" class="empty-state is-hidden">
            <p>You haven’t selected any products yet.</p>
            <a href="index.html#products" class="btn btn-primary">Browse products</a>
          </div>
          <div class="cart-list" id="cart-list"></div>
          <div class="cart-actions is-hidden" id="cart-footer">
            <a href="index.html#products" class="btn btn-ghost">Continue shopping</a>
            <button type="button" class="btn btn-primary" id="btn-checkout">Next — delivery details</button>
          </div>
        </section>
        <aside class="page-aside">
          <div class="panel" id="cart-summary"></div>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <p><strong>Asmak</strong> — online seafood store</p>
    </footer>

    <a href="cart.html" class="fab-cart" data-fab-cart aria-hidden="true">
      <span class="fab-cart__count" data-cart-count>0</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span class="fab-cart__label">Cart</span>
    </a>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/products.js"></script>
    <script src="js/cart-store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/cart-page.js"></script>
  </body>
</html>
