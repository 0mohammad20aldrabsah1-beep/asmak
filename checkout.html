<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asmak | Delivery details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="index.html" class="brand">
          <span class="brand-mark" aria-hidden="true">🐟</span>
          <span>
            <div class="brand-name">Asmak</div>
            <div class="brand-tagline">Fresh daily to your door</div>
          </span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="cart.html">Cart</a>
          <a href="checkout.html" class="is-current">Details</a>
        </nav>
      </div>
    </header>

    <main class="page-wrap">
      <nav class="checkout-steps" id="checkout-steps" aria-label="Checkout steps"></nav>

      <header class="page-title">
        <h1>Delivery information</h1>
        <p>Enter your details to complete the order.</p>
      </header>

      <div class="page-layout">
        <section class="page-main">
          <form class="form-card" id="customer-form" novalidate>
            <div class="form-field">
              <label for="name">Name <span class="req">*</span></label>
              <input id="name" name="name" type="text" required autocomplete="name" placeholder="Full name" />
            </div>
            <div class="form-field">
              <label for="phone">Phone number <span class="req">*</span></label>
              <div class="phone-input-group" dir="ltr">
                <span class="phone-input-group__prefix" aria-hidden="true">+974</span>
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  required
                  autocomplete="tel"
                  inputmode="numeric"
                  placeholder="5512 3456"
                  dir="ltr"
                  maxlength="9"
                />
              </div>
            </div>
            <div class="form-field">
              <label for="address">Address <span class="req">*</span></label>
              <textarea id="address" name="address" required rows="3" placeholder="Area, street, building number"></textarea>
            </div>
            <div class="form-field">
              <label for="notes">Additional info <span class="optional">(optional)</span></label>
              <textarea id="notes" name="notes" rows="2" placeholder="Delivery instructions or order notes"></textarea>
            </div>
            <div class="form-actions">
              <a href="cart.html" class="btn btn-ghost">Back to cart</a>
              <button type="submit" class="btn btn-primary">Next — payment</button>
            </div>
          </form>
        </section>
        <aside class="page-aside">
          <div class="panel">
            <h2 class="panel__title">Order summary</h2>
            <div id="checkout-summary"></div>
          </div>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <p><strong>Asmak</strong> — online seafood store</p>
    </footer>

    <a href="cart.html" class="fab-cart" data-fab-cart aria-hidden="true">
      <span class="fab-cart__count" data-cart-count>0</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span class="fab-cart__label">Cart</span>
    </a>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/products.js"></script>
    <script src="js/cart-store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/qatar-phone.js"></script>
    <script src="js/telegram-notify.js"></script>
    <script src="js/checkout-page.js"></script>
  </body>
</html>
